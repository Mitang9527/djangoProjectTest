apiVersion: v1
kind: ConfigMap
metadata:
  name: django-config
  namespace: django-saas
  labels:
    app.kubernetes.io/name: django-saas
    app.kubernetes.io/component: config
data:
  DJANGO_SETTINGS_MODULE: "djangoProjectTest.settings.production"
  DJANGO_ALLOWED_HOSTS: "api.example.com,localhost"
  DJANGO_DEBUG: "False"
  DJANGO_LOG_LEVEL: "INFO"
  DB_HOST: "postgres"
  DB_PORT: "5432"
  DB_NAME: "djangosaas"
  DB_USER: "djangosaas"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"
  FLOWER_PORT: "5555"
  FLOWER_BASIC_AUTH: "admin:admin"
