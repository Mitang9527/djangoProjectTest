apiVersion: v1
kind: Secret
metadata:
  name: django-secret
  namespace: django-saas
  labels:
    app.kubernetes.io/name: django-saas
    app.kubernetes.io/component: secret
type: Opaque
stringData:
  # Replace these placeholder values before deploying
  SECRET_KEY: "CHANGE_ME_random_secret_key_at_least_50_chars"
  DB_PASSWORD: "CHANGE_ME_db_password"
  JWT_SIGNING_KEY: "CHANGE_ME_jwt_signing_key"
  API_SECRET_KEY: "CHANGE_ME_api_secret_key"
