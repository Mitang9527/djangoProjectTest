# ================================================================
# Nginx 站点配置 —— Django SaaS + Vue SPA（前后端分离 / 生产）
# ----------------------------------------------------------------
# 架构：
#   • Nginx 直接托管构建好的 Vue SPA（dist），作为唯一前端入口
#   • /api、/admin、/ws 反向代理到 Django（gunicorn）
#   • /static、/media 由 Nginx 直出（Django collectstatic 产物 / 用户上传）
#   • 前端使用 hash 路由（#/xxx），所有页面请求都落在 /，无需服务端 rewrite
# ================================================================

# Django 上游（支持多实例负载均衡）
upstream django_backend {
    least_conn;
    server web:8000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ----------------------------------------------------------------
# HTTP → 重定向 HTTPS（生产环境开启，开发环境注释掉）
# ----------------------------------------------------------------
# server {
#     listen 80;
#     server_name _;
#     return 301 https://$host$request_uri;
# }

# ----------------------------------------------------------------
# 主服务器配置
# ----------------------------------------------------------------
server {
    listen 80;
    # listen 443 ssl http2;          # 开启 HTTPS 时取消注释
    server_name _;                   # 替换为你的域名，如 example.com

    # SSL 证书（开启 HTTPS 时配置）
    # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers HIGH:!aNULL:!MD5;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache shared:SSL:10m;

    # SPA 静态资源根目录（由 Dockerfile.nginx 在构建期把 Vue dist 拷入）
    root /usr/share/nginx/html;
    index index.html;

    # ---- 媒体文件（用户上传，仍由 Django 管理，Nginx 直出）----
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- WebSocket 连接 ----
    location /ws/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;    # WebSocket 长连接 24h
        proxy_send_timeout 86400;
    }

    # ---- Django 管理后台 ----
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- API（含 DRF Swagger / Redoc / health）----
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # ---- 健康检查（不记录日志）----
    location = /api/health/ {
        proxy_pass http://django_backend;
        access_log off;
    }

    # ---- Django 收集的静态文件（admin 样式等）----
    location /static/ {
        alias /app/static_root/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }

    # ---- SPA 前端：其余所有请求回退到 index.html ----
    # （hash 路由下实际只有 / 和 /assets/* 两类；此处兜底避免深链接 404）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 拒绝访问敏感文件 ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
