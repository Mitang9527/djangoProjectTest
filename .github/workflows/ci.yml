# ================================================================
# CI/CD Pipeline
# Stage 1: Lint (ruff)
# Stage 2: Type Check (mypy)
# Stage 3: Test (pytest + coverage)
# Stage 4: Security Scan (bandit + safety)
# Stage 5: Build (Docker image)
# ================================================================
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: "djangoProjectTest.settings.test"
  SECRET_KEY: "ci-secret-key-not-for-production-use-only-at-least-10-chars"
  JWT_SIGNING_KEY: "ci-jwt-signing-key-independent-from-secret-key-10c"
  API_SECRET_KEY: "ci-api-secret-key-not-for-production-use"
  DEBUG: "False"
  ENV: "TEST"

jobs:
  # ================================================================
  # Stage 1: 代码风格检查
  # ================================================================
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff>=0.6.0

      - name: Run Ruff Linter
        run: ruff check apps/ utils/ tests/ conftest.py

      - name: Run Ruff Formatter Check
        run: ruff format --check apps/ utils/ tests/ conftest.py

  # ================================================================
  # Stage 2: 类型检查
  # ================================================================
  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install mypy django-stubs djangorestframework-stubs types-PyYAML pydantic
      - name: Run Mypy
        run: mypy apps/ utils/ --config-file pyproject.toml
        continue-on-error: true  # 首次集成，暂不阻塞

  # ================================================================
  # Stage 3: 单元测试 + 覆盖率
  # ================================================================
  test:
    name: Test (Pytest + Coverage)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov pytest-xdist pytest-mock factory-boy python-magic

      - name: Run migrations check
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          pytest tests/ -v \
            --cov=apps \
            --cov=utils \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --cov-fail-under=15 \
            --tb=short
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          DEBUG: ${{ env.DEBUG }}
          ENV: ${{ env.ENV }}
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ================================================================
  # Stage 4: 安全扫描
  # ================================================================
  security:
    name: Security Scan (Bandit + Safety)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install tools
        run: pip install bandit[toml] safety

      - name: Run Bandit
        run: bandit -r apps/ utils/ -c pyproject.toml -ll

      - name: Run Safety check
        run: safety check --short-report
        continue-on-error: true  # 依赖漏洞暂不阻塞

  # ================================================================
  # Stage 5: Docker 构建
  # ================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: djangosaas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
