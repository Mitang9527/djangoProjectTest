# ================================================================
# CI/CD Pipeline
# Stage 1: Lint (ruff — 仅检查变更文件，存量 2000+ 问题不阻塞)
# Stage 2: Type Check (mypy — 存量类型债基线，continue-on-error 暂不阻塞)
# Stage 3: Test (pytest + coverage)
# Stage 4: Security Scan (bandit + pip-audit)
# Stage 5: Build (Docker image)
# ================================================================
name: CI

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: "3.12"
  DJANGO_SETTINGS_MODULE: "djangoProjectTest.settings.test"
  SECRET_KEY: "ci-secret-key-not-for-production-use-only-at-least-10-chars"
  JWT_SIGNING_KEY: "ci-jwt-signing-key-independent-from-secret-key-10c"
  API_SECRET_KEY: "ci-api-secret-key-not-for-production-use"
  DEBUG: "False"
  ENV: "TEST"

# 并发：同一分支新提交自动取消上一轮还在跑的 CI
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ================================================================
  # Stage 1: 代码风格检查（只检查本次变更的 Python 文件）
  # 说明：仓库存量 ruff 问题 ~2149 个（其中 ~1635 可自动修复），
  # 全量检查会长期全红，故 CI 聚焦增量；存量清理见 pyproject [tool.ruff]。
  # ================================================================
  lint:
    name: Lint (Ruff, changed files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要历史提交才能 diff 出变更文件

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Ruff
        run: pip install "ruff>=0.6.0"

      - name: Collect changed Python files
        id: changed
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "files=" >> "$GITHUB_OUTPUT"
            echo "No base commit — skip changed-file lint"
            exit 0
          fi
          files=$(git diff --name-only --diff-filter=ACM "$base"...HEAD -- '*.py' || true)
          echo "files=$files" >> "$GITHUB_OUTPUT"
          if [[ -z "$files" ]]; then
            echo "No changed Python files"
          else
            echo "Changed files:"
            echo "$files"
          fi

      - name: Ruff check (changed files)
        run: |
          files="${{ steps.changed.outputs.files }}"
          if [[ -z "$files" ]]; then
            echo "跳过（无变更 Python 文件）"
            exit 0
          fi
          ruff check $files

      - name: Ruff format check (changed files)
        run: |
          files="${{ steps.changed.outputs.files }}"
          if [[ -z "$files" ]]; then
            echo "跳过（无变更 Python 文件）"
            exit 0
          fi
          ruff format --check $files

  # ================================================================
  # Stage 2: 类型检查
  # ================================================================
  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy django-stubs djangorestframework-stubs types-PyYAML pydantic

      - name: Run Mypy
        run: mypy apps/ framework/ --config-file pyproject.toml
        continue-on-error: true  # 存量类型债基线（~820 项），清理完成后再开启阻塞

  # ================================================================
  # Stage 3: 单元测试 + 覆盖率
  # ================================================================
  test:
    name: Test (Pytest + Coverage)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        run: |
          pip install -r requirements/test.txt
          pip install python-magic

      - name: Run migrations check
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Run tests with coverage
        run: |
          pytest -n auto -v --tb=short
        env:
          SECRET_KEY: ${{ env.SECRET_KEY }}
          DEBUG: ${{ env.DEBUG }}
          ENV: ${{ env.ENV }}
          DJANGO_SETTINGS_MODULE: ${{ env.DJANGO_SETTINGS_MODULE }}

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            htmlcov/

  # ================================================================
  # Stage 4: 安全扫描
  # ================================================================
  security:
    name: Security Scan (Bandit + Pip-audit)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install tools
        run: pip install bandit pip-audit

      - name: Run Bandit
        run: bandit -r apps/ framework/ -c pyproject.toml -ll

      - name: Run Pip-audit (dependency vulnerabilities)
        run: pip-audit -r requirements.txt
        continue-on-error: true  # 依赖漏洞暂不阻塞，见输出告警

  # ================================================================
  # Stage 5: Docker 构建
  # ================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: djangosaas:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
