# AI 创作工作室独立服务编排（RabbitMQ + Celery 解耦版）
#   api    : Daphne(ASGI) 同时提供 /api/v1/ HTTP 接口 与 /ws/ WebSocket 通道
#   worker : Celery 消费 ai_studio.generate 队列，执行生成任务
#   rabbitmq: 任务队列 broker（跨服务解耦主平台与 AI 服务）
#   postgres: 业务数据库（额度 / 任务）
#
# 启动: docker compose --env-file .env up --build
# 主平台侧通过 CELERY_BROKER_URL=amqp://rabbitmq:5672// 投递任务到同一 broker。

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_studio}
      POSTGRES_USER: ${POSTGRES_USER:-ai_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studio_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ai_studio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "ai_studio_service.asgi:application"]
    environment:
      DEBUG: "${DEBUG:-0}"
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me}"
      POSTGRES_DB: ${POSTGRES_DB:-ai_studio}
      POSTGRES_USER: ${POSTGRES_USER:-ai_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studio_pass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: "amqp://rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-rpc://}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-change-me-shared-secret}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      AI_STUDIO_SYNC: "${AI_STUDIO_SYNC:-1}"
      # 多 api 实例时启用：AI_STUDIO_CHANNEL_REDIS: "redis://redis:6379/0"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["worker"]
    environment:
      DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:-change-me}"
      POSTGRES_DB: ${POSTGRES_DB:-ai_studio}
      POSTGRES_USER: ${POSTGRES_USER:-ai_studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_studio_pass}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      CELERY_BROKER_URL: "amqp://rabbitmq:5672//"
      CELERY_RESULT_BACKEND: "${CELERY_RESULT_BACKEND:-rpc://}"
      JWT_SIGNING_KEY: "${JWT_SIGNING_KEY:-change-me-shared-secret}"
      # worker 监听生成队列（handle_generation / generate_task 均路由到此）
      CELERY_WORKER_QUEUES: "ai_studio.generate"
      AI_STUDIO_SYNC: "0"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
