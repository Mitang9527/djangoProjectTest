{% extends 'core/base.html' %}
{% load bootstrap4 %}

{% block title %}设置新密码 - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow-sm border-0 rounded-lg mt-5">
            {% if validlink %}
            <div class="card-header bg-white border-0 pt-4 text-center">
                <h3 class="font-weight-bold">设置新密码</h3>
                <p class="text-muted">请在下方输入您的新密码。</p>
            </div>
            <div class="card-body px-4 pb-4">
                <form method="post">
                    {% csrf_token %}
                    {% bootstrap_form form %}
                    <button type="submit" class="btn btn-primary btn-lg btn-block shadow-sm font-weight-bold mt-3">确认修改</button>
                </form>
            </div>
            {% else %}
            <div class="card-body p-5 text-center">
                <h3 class="text-danger font-weight-bold">链接已失效</h3>
                <p class="text-muted mt-3">该重置密码链接无效，可能因为它已被使用过，或者已过期。</p>
                <a href="{% url 'users:password_reset' %}" class="btn btn-primary mt-3">重新申请重置</a>
            </div>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
