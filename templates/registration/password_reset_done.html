{% extends 'core/base.html' %}
{% load bootstrap4 %}
{% load i18n %}

{% block title %}{% trans "邮件已发送" %} - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-lg mt-5 p-4 text-center">
            <div class="mb-4">
                <span style="font-size: 4rem;">📧</span>
            </div>
            <h3 class="font-weight-bold">{% trans "重置邮件已发送" %}</h3>
            <p class="lead text-muted mt-3">
                {% trans "我们已向您的邮箱发送了重置密码的指令。如果您在几分钟内没有收到邮件，请检查您的垃圾邮件文件夹。" %}
            </p>
            <div class="mt-4">
                <a href="{% url 'users:login' %}" class="btn btn-outline-primary px-5">{% trans "返回登录" %}</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
