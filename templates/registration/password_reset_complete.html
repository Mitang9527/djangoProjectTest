{% extends 'core/base.html' %}
{% load bootstrap4 %}

{% block title %}修改成功 - {{ block.super }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0 rounded-lg mt-5 p-4 text-center">
            <div class="mb-4">
                <span style="font-size: 4rem;">✅</span>
            </div>
            <h3 class="font-weight-bold text-success">密码修改成功</h3>
            <p class="lead text-muted mt-3">
                您的密码已成功重置。您现在可以使用新密码登录了。
            </p>
            <div class="mt-4">
                <a href="{% url 'users:login' %}" class="btn btn-primary px-5 font-weight-bold">立即登录</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
