{% extends 'saas/base_saas.html' %}
{% load i18n %}

{% block saas_content %}
<div x-data="gatewayRules()" x-init="init()">
    <!-- 顶部导航 -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-slate-900">限流规则管理</h1>
            <p class="text-sm text-slate-500 mt-1">配置 API 路由的访问频率限制</p>
        </div>
        <div class="flex items-center gap-3">
            <a href="{% url 'saas:gateway-dashboard' %}" class="inline-flex items-center px-3 py-2 text-sm text-slate-600 hover:text-slate-900 border border-slate-300 rounded-lg hover:bg-slate-50 transition-colors">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                返回仪表盘
            </a>
            <button @click="openCreateModal()" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
                <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                新建规则
            </button>
        </div>
    </div>

    <!-- 规则表格 -->
    <div class="bg-white rounded-lg shadow-sm border border-slate-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="w-full">
                <thead class="bg-slate-50 border-b border-slate-200">
                    <tr>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">优先级</th>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">规则名称</th>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">URL 模式</th>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">类型</th>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">速率</th>
                        <th class="text-left text-xs font-medium text-slate-500 uppercase px-4 py-3">状态</th>
                        <th class="text-right text-xs font-medium text-slate-500 uppercase px-4 py-3">操作</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <template x-if="rules.length === 0">
                        <tr>
                            <td colspan="7" class="px-4 py-12 text-center">
                                <svg class="w-12 h-12 text-slate-300 mx-auto mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                <p class="text-sm text-slate-500">暂无限流规则</p>
                                <p class="text-xs text-slate-400 mt-1">点击「新建规则」添加第一条限流策略</p>
                            </td>
                        </tr>
                    </template>
                    <template x-for="rule in rules" :key="rule.id">
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-3">
                                <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-slate-100 text-slate-700" x-text="rule.priority"></span>
                            </td>
                            <td class="px-4 py-3">
                                <p class="text-sm font-medium text-slate-900" x-text="rule.name"></p>
                                <p class="text-xs text-slate-400" x-text="rule.description" x-show="rule.description"></p>
                            </td>
                            <td class="px-4 py-3">
                                <code class="text-xs font-mono text-slate-600 bg-slate-50 px-2 py-0.5 rounded" x-text="rule.url_pattern"></code>
                                <span x-show="rule.use_regex" class="ml-1 inline-flex items-center px-1.5 py-0.5 rounded text-xs bg-indigo-50 text-indigo-600">regex</span>
                            </td>
                            <td class="px-4 py-3">
                                <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                                      :class="throttleTypeClass(rule.throttle_type)"
                                      x-text="rule.throttle_type_display"></span>
                            </td>
                            <td class="px-4 py-3">
                                <code class="text-sm font-mono font-medium" :class="rule.is_active ? 'text-emerald-600' : 'text-slate-400'" x-text="rule.rate"></code>
                            </td>
                            <td class="px-4 py-3">
                                <button @click="toggleRule(rule)"
                                        :class="rule.is_active ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-slate-50 text-slate-400 border-slate-200'"
                                        class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium border transition-colors">
                                    <span class="w-1.5 h-1.5 rounded-full mr-1" :class="rule.is_active ? 'bg-emerald-500' : 'bg-slate-300'"></span>
                                    <span x-text="rule.is_active ? '启用' : '禁用'"></span>
                                </button>
                            </td>
                            <td class="px-4 py-3 text-right">
                                <div class="flex items-center justify-end gap-1">
                                    <button @click="openEditModal(rule)" class="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded transition-colors" title="编辑">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    </button>
                                    <button @click="deleteRule(rule)" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded transition-colors" title="删除">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </tbody>
            </table>
        </div>
    </div>

    <!-- 创建/编辑弹窗 -->
    <template x-if="showModal">
        <div class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center" @click.self="closeModal()">
            <div class="bg-white rounded-xl shadow-xl w-full max-w-lg mx-4" @click.stop>
                <div class="flex items-center justify-between px-6 py-4 border-b border-slate-200">
                    <h3 class="text-lg font-semibold text-slate-900" x-text="editingRule ? '编辑规则' : '新建限流规则'"></h3>
                    <button @click="closeModal()" class="p-1 text-slate-400 hover:text-slate-600 rounded">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="px-6 py-4 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">规则名称 <span class="text-red-500">*</span></label>
                        <input type="text" x-model="form.name" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如: 限制导出接口频率">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">URL 模式 <span class="text-red-500">*</span></label>
                        <input type="text" x-model="form.url_pattern" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm font-mono focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="例如: /api/export/* 或 ^/saas/api/">
                        <div class="flex items-center mt-1.5">
                            <input type="checkbox" x-model="form.use_regex" id="useRegex" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                            <label for="useRegex" class="ml-2 text-xs text-slate-500">使用正则表达式匹配</label>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">限流类型</label>
                            <select x-model="form.throttle_type" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="ip">IP 限流</option>
                                <option value="user">用户限流</option>
                                <option value="tenant">租户限流</option>
                                <option value="endpoint">端点限流</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">速率限制</label>
                            <select x-model="form.rate" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="10/m">10 次/分钟</option>
                                <option value="30/m">30 次/分钟</option>
                                <option value="60/m">60 次/分钟</option>
                                <option value="100/h" selected>100 次/小时</option>
                                <option value="500/h">500 次/小时</option>
                                <option value="1000/h">1000 次/小时</option>
                                <option value="5000/d">5000 次/天</option>
                                <option value="10000/d">10000 次/天</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">优先级</label>
                            <input type="number" x-model="form.priority" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="越小越高">
                        </div>
                        <div class="flex items-end pb-2">
                            <label class="flex items-center">
                                <input type="checkbox" x-model="form.is_active" class="w-4 h-4 text-indigo-600 rounded border-slate-300 focus:ring-indigo-500">
                                <span class="ml-2 text-sm text-slate-700">立即启用</span>
                            </label>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">描述</label>
                        <textarea x-model="form.description" rows="2" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500" placeholder="可选，规则用途说明"></textarea>
                    </div>
                </div>
                <div class="flex items-center justify-end gap-3 px-6 py-4 border-t border-slate-200 bg-slate-50 rounded-b-xl">
                    <button @click="closeModal()" class="px-4 py-2 text-sm text-slate-700 border border-slate-300 rounded-lg hover:bg-slate-100 transition-colors">取消</button>
                    <button @click="saveRule()" :disabled="submitting" class="px-4 py-2 text-sm text-white bg-indigo-600 rounded-lg hover:bg-indigo-700 disabled:opacity-50 transition-colors" x-text="editingRule ? '保存修改' : '创建规则'"></button>
                </div>
            </div>
        </div>
    </template>

    <!-- 提示消息 -->
    <div x-show="toast.show" x-transition class="fixed bottom-6 right-6 z-50">
        <div :class="toast.type === 'success' ? 'bg-emerald-600' : 'bg-red-600'" class="text-white px-4 py-3 rounded-lg shadow-lg text-sm flex items-center gap-2">
            <span x-text="toast.msg"></span>
            <button @click="toast.show = false" class="text-white/70 hover:text-white">&times;</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('gatewayRules', () => ({
        rules: [],
        showModal: false,
        editingRule: null,
        submitting: false,
        toast: { show: false, msg: '', type: 'success' },

        form: {
            name: '',
            url_pattern: '',
            throttle_type: 'ip',
            rate: '100/h',
            is_active: true,
            use_regex: false,
            priority: 0,
            description: '',
        },

        async init() {
            await this.loadRules();
        },

        async loadRules() {
            try {
                const resp = await saasFetch('/saas/api/gateway/rules/');
                const raw = await resp.json();
                const data = raw.data || raw;
                this.rules = data.rules || [];
            } catch (e) {
                this.showToast('加载规则列表失败', 'error');
            }
        },

        throttleTypeClass(type) {
            const map = {
                'ip': 'bg-blue-50 text-blue-700',
                'user': 'bg-purple-50 text-purple-700',
                'tenant': 'bg-amber-50 text-amber-700',
                'endpoint': 'bg-indigo-50 text-indigo-700',
            };
            return map[type] || 'bg-slate-50 text-slate-700';
        },

        openCreateModal() {
            this.editingRule = null;
            this.form = { name: '', url_pattern: '', throttle_type: 'ip', rate: '100/h', is_active: true, use_regex: false, priority: this.rules.length, description: '' };
            this.showModal = true;
        },

        openEditModal(rule) {
            this.editingRule = rule;
            this.form = {
                name: rule.name,
                url_pattern: rule.url_pattern,
                throttle_type: rule.throttle_type,
                rate: rule.rate,
                is_active: rule.is_active,
                use_regex: rule.use_regex,
                priority: rule.priority,
                description: rule.description || '',
            };
            this.showModal = true;
        },

        closeModal() {
            this.showModal = false;
            this.editingRule = null;
        },

        async saveRule() {
            if (!this.form.name || !this.form.url_pattern) {
                this.showToast('请填写规则名称和 URL 模式', 'error');
                return;
            }
            this.submitting = true;
            try {
                let resp;
                if (this.editingRule) {
                    resp = await saasFetch(`/saas/api/gateway/rules/${this.editingRule.id}/update/`, {
                        method: 'PUT',
                        body: JSON.stringify(this.form),
                    });
                } else {
                    resp = await saasFetch('/saas/api/gateway/rules/create/', {
                        method: 'POST',
                        body: JSON.stringify(this.form),
                    });
                }
                const raw = await resp.json();
                if (resp.ok) {
                    this.showToast(raw.msg || '保存成功', 'success');
                    this.closeModal();
                    await this.loadRules();
                } else {
                    this.showToast(raw.msg || '保存失败', 'error');
                }
            } catch (e) {
                this.showToast('网络错误', 'error');
            } finally {
                this.submitting = false;
            }
        },

        async toggleRule(rule) {
            try {
                const resp = await saasFetch(`/saas/api/gateway/rules/${rule.id}/toggle/`, { method: 'POST' });
                const raw = await resp.json();
                if (resp.ok) {
                    this.showToast(raw.msg, 'success');
                    await this.loadRules();
                }
            } catch (e) {
                this.showToast('操作失败', 'error');
            }
        },

        async deleteRule(rule) {
            if (!confirm(`确定删除规则「${rule.name}」吗？此操作不可恢复。`)) return;
            try {
                const resp = await saasFetch(`/saas/api/gateway/rules/${rule.id}/delete/`, { method: 'DELETE' });
                if (resp.ok) {
                    this.showToast('规则已删除', 'success');
                    await this.loadRules();
                } else {
                    const raw = await resp.json();
                    this.showToast(raw.msg || '删除失败', 'error');
                }
            } catch (e) {
                this.showToast('网络错误', 'error');
            }
        },

        showToast(msg, type) {
            this.toast = { show: true, msg, type };
            setTimeout(() => { this.toast.show = false; }, 3000);
        },
    }));
});
</script>
{% endblock %}
