{% extends 'saas/base_saas.html' %}
{% load i18n %}

{% block saas_content %}
<div x-data="gatewayDashboard()" x-init="init()">
    <!-- 页面标题 -->
    <div class="mb-6">
        <h1 class="text-2xl font-bold text-slate-900">API 网关</h1>
        <p class="text-sm text-slate-500 mt-1">实时监控 API 流量，管理限流策略</p>
    </div>

    <!-- 统计卡片 -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-6">
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500">规则总数</p>
                    <p class="text-2xl font-bold text-slate-900" x-text="stats.total_rules">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-blue-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500">活跃规则</p>
                    <p class="text-2xl font-bold text-emerald-600" x-text="stats.active_rules">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-emerald-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500">已停用规则</p>
                    <p class="text-2xl font-bold text-slate-400" x-text="stats.inactive_rules">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-slate-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                </div>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm text-slate-500">限流类型</p>
                    <p class="text-2xl font-bold text-indigo-600" x-text="Object.keys(stats.type_stats || {}).filter(k => stats.type_stats[k] > 0).length">0</p>
                </div>
                <div class="w-10 h-10 rounded-lg bg-indigo-50 flex items-center justify-center">
                    <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/></svg>
                </div>
            </div>
        </div>
    </div>

    <!-- 限流类型说明 + 全局默认值 -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
        <div class="lg:col-span-2 bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <h2 class="text-base font-semibold text-slate-900 mb-4">限流类型说明</h2>
            <div class="space-y-3">
                <template x-for="t in stats.throttle_types" :key="t.id">
                    <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                        <div>
                            <span class="text-sm font-medium text-slate-700" x-text="t.name"></span>
                            <span class="text-xs text-slate-400 ml-2" x-text="t.desc"></span>
                        </div>
                        <span class="inline-flex items-center px-2 py-0.5 rounded-full text-xs font-medium"
                              :class="(stats.type_stats || {})[t.id] ? 'bg-blue-50 text-blue-700' : 'bg-slate-50 text-slate-400'"
                              x-text="((stats.type_stats || {})[t.id] || 0) + ' 条规则'"></span>
                    </div>
                </template>
            </div>
        </div>
        <div class="bg-white rounded-lg shadow-sm border border-slate-200 p-5">
            <h2 class="text-base font-semibold text-slate-900 mb-4">全局默认值</h2>
            <div class="space-y-2">
                <template x-for="(rate, type) in stats.global_defaults" :key="type">
                    <div class="flex items-center justify-between py-2 border-b border-slate-100 last:border-0">
                        <span class="text-sm text-slate-600" x-text="type"></span>
                        <code class="text-sm font-mono text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded" x-text="rate"></code>
                    </div>
                </template>
            </div>
        </div>
    </div>

    <!-- 操作按钮 -->
    <div class="flex justify-between items-center">
        <a href="{% url 'saas:gateway-rules' %}" class="inline-flex items-center px-4 py-2 bg-indigo-600 text-white text-sm font-medium rounded-lg hover:bg-indigo-700 transition-colors">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            管理限流规则
        </a>
    </div>
</div>

<script>
document.addEventListener('alpine:init', () => {
    Alpine.data('gatewayDashboard', () => ({
        stats: {
            total_rules: 0,
            active_rules: 0,
            inactive_rules: 0,
            type_stats: {},
            global_defaults: {},
            throttle_types: [],
        },

        async init() {
            await this.loadStats();
        },

        async loadStats() {
            try {
                const resp = await saasFetch('/saas/api/gateway/dashboard/');
                const raw = await resp.json();
                const data = raw.data || raw;
                this.stats = data;
            } catch (e) {
                console.warn('[Gateway] 加载仪表盘数据失败', e);
            }
        },
    }));
});
</script>
{% endblock %}
