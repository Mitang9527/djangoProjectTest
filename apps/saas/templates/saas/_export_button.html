{# 数据导出按钮组件 #}
{# 用法: {% include 'saas/_export_button.html' with model='saas.Tenant' %} #}
<div x-data="exportButton('{{ model }}')" class="relative inline-block">
    <button @click="open = !open"
            class="inline-flex items-center px-3 py-2 text-sm font-medium text-slate-700 bg-white border border-slate-300 rounded-lg hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors">
        <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        导出
        <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
    </button>

    <div x-show="open" @click.away="open = false"
         x-transition:enter="transition ease-out duration-150"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="absolute right-0 z-50 mt-1 w-48 bg-white rounded-lg shadow-lg border border-slate-200 py-1">

        <button @click="doExport('xlsx'); open = false"
                :disabled="exporting"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center transition-colors">
            <span class="inline-flex items-center justify-center w-6 h-6 mr-2 rounded bg-green-100 text-green-700 text-xs font-bold">E</span>
            <span x-text="exporting ? '导出中...' : 'Excel (.xlsx)'"></span>
            <span x-show="exporting" class="ml-auto">
                <svg class="animate-spin w-4 h-4 text-blue-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
            </span>
        </button>

        <button @click="doExport('csv'); open = false"
                :disabled="exporting"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center transition-colors">
            <span class="inline-flex items-center justify-center w-6 h-6 mr-2 rounded bg-blue-100 text-blue-700 text-xs font-bold">C</span>
            CSV (.csv)
        </button>

        <button @click="doExport('pdf'); open = false"
                :disabled="exporting"
                class="w-full text-left px-4 py-2.5 text-sm text-slate-700 hover:bg-slate-50 flex items-center transition-colors">
            <span class="inline-flex items-center justify-center w-6 h-6 mr-2 rounded bg-red-100 text-red-700 text-xs font-bold">P</span>
            PDF (.pdf)
        </button>
    </div>

    <!-- 提示消息 -->
    <div x-show="msg" x-text="msg" @click="msg = ''"
         x-transition
         class="absolute top-full right-0 mt-2 px-3 py-2 text-xs text-white bg-slate-800 rounded-lg shadow-lg cursor-pointer whitespace-nowrap z-50">
    </div>
</div>
