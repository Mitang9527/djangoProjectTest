{% extends 'saas/base_saas.html' %}
{% load i18n %}

{% block saas_content %}
<div class="bg-white dark:bg-slate-900 rounded-xl shadow-sm border border-slate-200 dark:border-slate-800 overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
        <h3 class="text-lg font-semibold text-slate-900 dark:text-slate-100">{{ title }}</h3>
        <div class="flex space-x-2">
            <button class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-blue-700 transition-colors">
                {{ action_text }}
            </button>
        </div>
    </div>
    <div class="p-12 text-center">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500 rounded-full mb-4">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
            </svg>
        </div>
        <h3 class="text-lg font-medium text-slate-900 dark:text-slate-100 mb-1">{% blocktrans with page_title=title %}{{ page_title }} 页面已创建{% endblocktrans %}</h3>
        <p class="text-slate-500 dark:text-slate-400 max-w-md mx-auto">{{ description }}</p>
        <div class="mt-6">
            <a href="{% url 'saas:dashboard' %}" class="text-blue-600 hover:text-blue-700 font-medium">{% trans "返回仪表盘" %}</a>
        </div>
    </div>
</div>
{% endblock %}
