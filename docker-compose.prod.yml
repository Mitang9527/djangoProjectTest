# ================================================================
# Docker Compose —— 生产环境
# 额外服务：Nginx 反向代理
# 使用: docker compose -f docker-compose.prod.yml up -d
# ================================================================

name: djangosaas-prod

x-django-common: &django-common
  image: ${DOCKER_IMAGE:-djangosaas:latest}
  env_file: .env.docker
  environment:
    DJANGO_SETTINGS_MODULE: djangoProjectTest.settings.prod
  volumes:
    - django_media:/app/media
    - django_logs:/app/logs
    - django_static:/app/static_root
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  networks:
    - backend
  restart: always

services:

  # ---- Nginx 反向代理（生产必须）----
  nginx:
    image: nginx:1.27-alpine
    container_name: saas_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - django_static:/app/static_root:ro
      - django_media:/app/media:ro
      - nginx_logs:/var/log/nginx
      - ssl_certs:/etc/nginx/ssl:ro    # HTTPS 证书目录（挂载你的证书）
    depends_on:
      - web
    networks:
      - backend
      - frontend
    restart: always
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---- Django Web 服务（生产用 Gunicorn）----
  web:
    <<: *django-common
    container_name: saas_web
    command: gunicorn
    expose:
      - "8000"
    deploy:
      replicas: 2                    # 生产环境双实例
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # ---- Celery Worker ----
  celery-worker:
    <<: *django-common
    container_name: saas_celery_worker
    command: celery-worker
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ---- Celery Beat ----
  celery-beat:
    <<: *django-common
    container_name: saas_celery_beat
    command: celery-beat

  # ---- Flower: Celery 任务监控（内网访问）----
  celery-flower:
    <<: *django-common
    container_name: saas_flower
    command: celery -A djangoProjectTest flower --port=5555 --url-prefix=flower --basic-auth=${FLOWER_USER:-admin}:${FLOWER_PASSWORD}
    expose:
      - "5555"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

  # ---- PostgreSQL ----
  postgres:
    image: postgres:16-alpine
    container_name: saas_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-saas_db}
      POSTGRES_USER: ${DB_USER:-saas_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - backend
    restart: always
    # 生产环境不暴露端口到主机
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-saas_user} -d ${DB_NAME:-saas_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---- Redis ----
  redis:
    image: redis:7-alpine
    container_name: saas_redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - backend
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  django_media:
  django_logs:
  django_static:
  nginx_logs:
  ssl_certs:

networks:
  backend:
    driver: bridge
    internal: true          # 生产环境：backend 网络不对外
  frontend:
    driver: bridge          # 只有 nginx 连接 frontend，对外暴露
